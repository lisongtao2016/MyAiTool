<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KindEditor 独立页面</title>
    <!-- KindEditor -->
    <link rel="stylesheet" href="js/kindeditor-master/themes/default/default.css" />
    <script charset="utf-8" src="js/kindeditor-master/kindeditor-all.js"></script>
    <script charset="utf-8" src="js/kindeditor-master/lang/zh-CN.js"></script>
    <script src="js/jquery-4.0.0.min.js" type="text/javascript" charset="utf-8"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            height: 100%;
            min-height: 300px;
            overflow: auto; /* 允许滚动以支持调整大小 */
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        #kindEditorContainer {
            width: 100%;
            height: 100%;
            min-height: 300px;
            position: relative;
        }
        
        #kindEditor {
            visibility: hidden;
            width: 100%;
            height: 100%;
        }
        
        /* 确保 KindEditor 容器可以调整大小 */
        .ke-container {
            width: 100% !important;
            height: 100% !important;
            min-height: 300px !important;
            position: relative !important;
            overflow: visible !important;
        }
        
        .ke-edit {
            height: calc(100% - 35px) !important; /* 减去工具栏高度 */
            min-height: 200px !important;
            overflow: auto !important;
        }
        
        .ke-edit-iframe {
            height: 100% !important;
            min-height: 200px !important;
        }
    </style>
</head>
<body>
    <div id="kindEditorContainer">
        <textarea id="kindEditor" name="editor1"></textarea>
    </div>
    
    <script>
        // 全局变量，用于与父页面通信
        window.kindEditorInstance = null;
        window.parentPage = window.parent;
        
    // 初始化 KindEditor
    function initKindEditor() {
        if (typeof KindEditor !== 'undefined') {
            console.log('KindEditor iframe: 开始初始化...');
            
            window.kindEditorInstance = KindEditor.create('#kindEditor', {
                allowFileManager: true,
                langType: 'zh-CN',
                width: '100%',
                height: '100%',
                resizeType: 2, // 允许拖动调整宽高
                minWidth: 100,
                minHeight: 100,
                afterCreate: function() {
                    // 确保编辑器内容左对齐
                    try {
                        var editorBody = this.edit.doc.body;
                        if (editorBody) {
                            editorBody.style.textAlign = 'left';
                            editorBody.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
                            editorBody.style.fontSize = '14px';
                            editorBody.style.lineHeight = '1.5';
                        }
                        
                        // 添加调整大小处理程序
                        try {
                            var container = this.container;
                            if (container && container.style) {
                                // 移除任何可能干扰拖动的样式
                                container.style.overflow = 'visible';
                                container.style.position = 'relative';
                                
                                // 添加一个提示，让用户知道可以调整大小
                                console.log('KindEditor iframe: 高度调整功能已启用，可以拖动右下角调整大小');
                            }
                        } catch (containerError) {
                            console.warn('设置容器样式失败:', containerError);
                        }
                    } catch (e) {
                        console.warn('设置编辑器内容样式失败:', e);
                    }
                    
                    // 通知父页面编辑器已就绪
                    if (window.parentPage) {
                        try {
                            window.parentPage.postMessage({
                                type: 'kindeditor_ready',
                                source: 'kindeditor_iframe'
                            }, '*');
                        } catch (e) {
                            console.warn('通知父页面失败:', e);
                        }
                    }
                    
                    console.log('KindEditor iframe: 初始化完成');
                },
                afterChange: function() {
                    // 内容变化时通知父页面
                    if (window.parentPage) {
                        try {
                            window.parentPage.postMessage({
                                type: 'kindeditor_content_changed',
                                content: this.html()
                            }, '*');
                        } catch (e) {
                            console.warn('发送内容变化通知失败:', e);
                        }
                    }
                },
                afterResize: function() {
                    console.log('KindEditor iframe: 编辑器大小已调整');
                    // 通知父页面编辑器大小已变化
                    if (window.parentPage) {
                        try {
                            window.parentPage.postMessage({
                                type: 'kindeditor_resized',
                                source: 'kindeditor_iframe'
                            }, '*');
                        } catch (e) {
                            console.warn('通知父页面编辑器大小变化失败:', e);
                        }
                    }
                }
            });
            
            console.log('KindEditor iframe: 编辑器实例创建成功');
        } else {
            console.error('KindEditor iframe: KindEditor 库未加载');
        }
    }
        
        // 监听父页面消息
        window.addEventListener('message', function(event) {
            var data = event.data;
            
            if (!data || !data.type) return;
            
            console.log('KindEditor iframe: 收到消息', data.type);
            
            switch (data.type) {
                case 'set_content':
                    if (window.kindEditorInstance) {
                        window.kindEditorInstance.html(data.content || '');
                        console.log('KindEditor iframe: 内容已设置');
                    }
                    break;
                    
                case 'get_content':
                    if (window.parentPage && window.kindEditorInstance) {
                        var content = window.kindEditorInstance.html();
                        window.parentPage.postMessage({
                            type: 'kindeditor_content_response',
                            content: content
                        }, '*');
                        console.log('KindEditor iframe: 内容已发送');
                    }
                    break;
                    
                case 'sync_to_kindeditor':
                    if (window.kindEditorInstance && data.content !== undefined) {
                        window.kindEditorInstance.html(data.content);
                        console.log('KindEditor iframe: 已同步内容');
                    }
                    break;
                    
                case 'show_editor':
                    document.getElementById('kindEditorContainer').style.display = 'block';
                    console.log('KindEditor iframe: 显示编辑器');
                    break;
                    
                case 'hide_editor':
                    document.getElementById('kindEditorContainer').style.display = 'none';
                    console.log('KindEditor iframe: 隐藏编辑器');
                    break;
            }
        });
        
        // 文档加载完成后初始化
        $(document).ready(function() {
            console.log('KindEditor iframe: 文档加载完成');
            initKindEditor();
        });
        
        // 向父页面报告 iframe 已加载
        window.addEventListener('load', function() {
            console.log('KindEditor iframe: 页面加载完成');
            if (window.parentPage) {
                try {
                    window.parentPage.postMessage({
                        type: 'iframe_loaded',
                        source: 'kindeditor_iframe'
                    }, '*');
                } catch (e) {
                    console.warn('发送加载完成通知失败:', e);
                }
            }
        });
    </script>
</body>
</html>
