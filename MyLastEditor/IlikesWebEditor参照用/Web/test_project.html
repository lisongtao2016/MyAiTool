<!DOCTYPE html>
<html>
<head>
    <title>项目管理功能测试</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .test-result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>项目管理功能测试</h1>
    
    <div class="test-section">
        <h2>1. 测试数据库初始化</h2>
        <button onclick="testDatabaseInit()">测试数据库初始化</button>
        <div id="dbResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试项目管理API</h2>
        <button onclick="testGetProjects()">获取项目列表</button>
        <button onclick="testCreateProject()">创建测试项目</button>
        <button onclick="testUpdateProject()">更新项目</button>
        <button onclick="testDeleteProject()">删除项目</button>
        <div id="projectResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 测试文档保存（带项目ID）</h2>
        <button onclick="testSaveContentWithProject()">保存文档到项目</button>
        <div id="contentResult" class="test-result"></div>
    </div>
    
    <script>
        var testProjectId = null;
        
        function logResult(elementId, message, isSuccess) {
            var $element = $('#' + elementId);
            $element.html('<strong>' + (isSuccess ? '✅ 成功' : '❌ 失败') + ':</strong> ' + message);
            $element.removeClass('success error').addClass(isSuccess ? 'success' : 'error');
        }
        
        function testDatabaseInit() {
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/CheckSession",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    logResult('dbResult', result.message, result.success);
                },
                error: function(xhr, status, error) {
                    logResult('dbResult', '请求失败: ' + error, false);
                }
            });
        }
        
        function testGetProjects() {
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/GetAllProjects",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    if (result.success) {
                        var message = '找到 ' + result.projects.length + ' 个项目:<br>';
                        result.projects.forEach(function(project) {
                            message += 'ID: ' + project.id + ', 名称: ' + project.name + '<br>';
                        });
                        logResult('projectResult', message, true);
                        
                        // 保存第一个项目的ID用于测试
                        if (result.projects.length > 0) {
                            testProjectId = result.projects[0].id;
                        }
                    } else {
                        logResult('projectResult', result.message, false);
                    }
                },
                error: function(xhr, status, error) {
                    logResult('projectResult', '请求失败: ' + error, false);
                }
            });
        }
        
        function testCreateProject() {
            var projectName = '测试项目_' + new Date().getTime();
            var projectDescription = '这是一个自动创建的测试项目';
            
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/CreateProject",
                data: JSON.stringify({
                    name: projectName,
                    description: projectDescription
                }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    if (result.success) {
                        testProjectId = result.id;
                        logResult('projectResult', '项目创建成功！ID: ' + result.id + ', 名称: ' + projectName, true);
                    } else {
                        logResult('projectResult', result.message, false);
                    }
                },
                error: function(xhr, status, error) {
                    logResult('projectResult', '请求失败: ' + error, false);
                }
            });
        }
        
        function testUpdateProject() {
            if (!testProjectId) {
                logResult('projectResult', '请先创建或获取一个项目', false);
                return;
            }
            
            var newName = '更新后的项目_' + new Date().getTime();
            var newDescription = '这是更新后的项目描述';
            
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/UpdateProject",
                data: JSON.stringify({
                    id: testProjectId,
                    name: newName,
                    description: newDescription
                }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    logResult('projectResult', result.message, result.success);
                },
                error: function(xhr, status, error) {
                    logResult('projectResult', '请求失败: ' + error, false);
                }
            });
        }
        
        function testDeleteProject() {
            if (!testProjectId) {
                logResult('projectResult', '请先创建或获取一个项目', false);
                return;
            }
            
            if (!confirm('确定要删除项目 ID ' + testProjectId + ' 吗？')) {
                return;
            }
            
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/DeleteProject",
                data: JSON.stringify({ id: testProjectId }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    logResult('projectResult', result.message, result.success);
                    if (result.success) {
                        testProjectId = null;
                    }
                },
                error: function(xhr, status, error) {
                    logResult('projectResult', '请求失败: ' + error, false);
                }
            });
        }
        
        function testSaveContentWithProject() {
            if (!testProjectId) {
                logResult('contentResult', '请先创建或获取一个项目', false);
                return;
            }
            
            var title = '测试文档_' + new Date().getTime();
            var content = '这是一个测试文档内容，保存到项目ID: ' + testProjectId;
            var language = 'HTML';
            
            $.ajax({
                type: "POST",
                url: "WebServ.asmx/SaveContent",
                data: JSON.stringify({
                    title: title,
                    content: content,
                    language: language,
                    subtitle: '测试副标题',
                    author: '测试用户',
                    hotTags: '测试,项目',
                    shareTo: '',
                    plainText: content,
                    category: '测试分类',
                    projectId: testProjectId
                }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    if (result.success) {
                        logResult('contentResult', '文档保存成功！ID: ' + result.id + ', 项目ID: ' + testProjectId, true);
                    } else {
                        logResult('contentResult', result.message, false);
                    }
                },
                error: function(xhr, status, error) {
                    logResult('contentResult', '请求失败: ' + error, false);
                }
            });
        }
        
        // 页面加载时测试数据库初始化
        $(document).ready(function() {
            testDatabaseInit();
        });
    </script>
</body>
</html>
