<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>测试内容显示</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-item { 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
            background: #f9f9f9; 
        }
        .title { font-size: 18px; font-weight: bold; color: #333; }
        .author { color: #666; margin-left: 10px; }
        .language { color: #4ecdc4; font-weight: bold; margin-left: 10px; }
        .date { color: #999; font-size: 12px; margin-left: 10px; }
        .debug { background: #2d2d2d; color: #fff; padding: 10px; border-radius: 5px; margin-top: 5px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>测试内容显示</h1>
    <button onclick="loadContents()">加载内容</button>
    <div id="result"></div>
    
    <script>
        function loadContents() {
            $('#result').html('加载中...');
            
            $.ajax({
                type: "POST",
                url: "WebForm1.aspx/GetAllContents",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    var result = response.d ? JSON.parse(response.d) : response;
                    
                    if (result.success && result.contents) {
                        displayContents(result.contents);
                    } else {
                        $('#result').html('错误: ' + (result.message || '未知错误'));
                    }
                },
                error: function(xhr, status, error) {
                    $('#result').html('AJAX错误: ' + error);
                }
            });
        }
        
        function displayContents(contents) {
            var html = '';
            
            html += '<p>找到 ' + contents.length + ' 条内容</p>';
            
            for (var i = 0; i < contents.length; i++) {
                var content = contents[i];
                
                // 提取字段
                var title = content.title || content.Title || '无标题';
                var author = content.author || content.Author || '匿名';
                var language = content.language || content.Language || '未知';
                var createdDate = content.createdDate || content.CreatedDate || '未知';
                
                // 转义HTML
                var escapeHtml = function(text) {
                    if (!text) return '';
                    var map = {
                        '&': '&',
                        '<': '<',
                        '>': '>',
                        '"': '"',
                        "'": '&#039;'
                    };
                    return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
                };
                
                // 格式化日期
                var formatDate = function(dateString) {
                    if (!dateString) return '未知';
                    try {
                        var date = new Date(dateString);
                        return date.toLocaleString();
                    } catch (e) {
                        return dateString;
                    }
                };
                
                html += '<div class="test-item">';
                html += '<div class="title">标题: ' + escapeHtml(title) + '</div>';
                html += '<div>';
                html += '<span class="author">👤 ' + escapeHtml(author) + '</span>';
                html += '<span class="language">💻 ' + escapeHtml(language) + '</span>';
                html += '<span class="date">📅 ' + formatDate(createdDate) + '</span>';
                html += '</div>';
                html += '<div class="debug">原始数据: ' + JSON.stringify(content) + '</div>';
                html += '</div>';
            }
            
            $('#result').html(html);
        }
        
        // 页面加载时自动加载
        $(document).ready(function() {
            loadContents();
        });
    </script>
</body>
</html>
