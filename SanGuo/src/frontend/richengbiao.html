<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业级 Canvas 日程管理系统</title>
    <style>
        body { margin: 0; overflow: hidden; background: #eef1f5; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        canvas { display: block; background: white; }
        
        /* 编辑器样式 */
        #cell-editor {
            position: absolute; display: none;
            border: 2px solid #4a90e2; padding: 0 5px;
            font-size: 12px; outline: none; z-index: 100;
            background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* UI 面板 */
        #ui-panel {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(45, 52, 54, 0.9); color: white;
            padding: 10px 20px; border-radius: 30px;
            font-size: 13px; pointer-events: none; z-index: 10;
        }

        /* 搜索框样式 */
        #search-container {
            position: absolute; top: 10px; right: 20px;
            z-index: 100;
        }
        #search-input {
            padding: 8px 15px; border: 2px solid #4a90e2;
            border-radius: 20px; font-size: 14px;
            width: 250px; outline: none;
            background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #search-input::placeholder {
            color: #888;
        }

        /* 导出按钮样式 */
        #export-container {
            position: absolute; top: 10px; right: 280px;
            z-index: 100;
        }
        #export-btn {
            padding: 8px 15px; border: 2px solid #40c057;
            border-radius: 20px; font-size: 14px; color: white;
            background: #40c057; cursor: pointer;
            outline: none; font-weight: bold;
        }
        #export-btn:hover {
            background: #38a34d;
            border-color: #38a34d;
        }
    </style>
</head>
<body>

<div id="ui-panel">提示：点击左侧文字进行编辑 | 拖拽右侧查看进度 | Shift+滚轮横向移动</div>
<div id="export-container">
    <button id="export-btn">导出PNG</button>
</div>
<div id="search-container">
    <input type="text" id="search-input" placeholder="搜索担当者...">
</div>
<input type="text" id="cell-editor">
<canvas id="ganttCanvas"></canvas>

<script>
const canvas = document.getElementById('ganttCanvas');
const ctx = canvas.getContext('2d');
const editor = document.getElementById('cell-editor');

// --- 1. 配置 ---
const ROW_HEIGHT = 50;      // 增加行高以容纳上下两行文字
const HEADER_HEIGHT = 60;
const COL_CONFIG = [
    { name: "项目分级", width: 120, keys: ["group", "subGroup"] }, // 上下结构
    { name: "小项目名", width: 150, keys: ["name"] },
    { name: "期间", width: 110, keys: ["start_date", "end_date"] }, // 上下结构
    { name: "进度(计/实)", width: 100, keys: ["plan", "actual"] },   // 上下结构
    { name: "担当者", width: 80, keys: ["owner"] }
];
const FIXED_WIDTH = COL_CONFIG.reduce((sum, c) => sum + c.width, 0);
const DAY_WIDTH = 45;

// --- 2. 数据库连接配置 ---
const API_BASE_URL = 'http://localhost:3001/api';
let tasks = [];
let offsetX = 0, offsetY = 0;
let editingInfo = null; // 记录当前正在编辑哪个单元格

// 加载任务数据
async function loadTasks() {
    try {
        const response = await fetch(`${API_BASE_URL}/tasks`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        tasks = await response.json();
        
        // 确保数据格式正确
        tasks.forEach(task => {
            task.group = task.group || "核心A项目";
            task.subGroup = task.subGroup || "模块0";
            task.start_date = task.start_date || "2026-04-06";
            task.end_date = task.end_date || "2026-04-15";
            task.start_day = task.start_day || 0;
            task.duration = task.duration || 5;
            task.plan = task.plan || 100;
            task.actual = task.actual || 0;
            task.owner = task.owner || "张三";
        });
        
        console.log(`Loaded ${tasks.length} tasks from database`);
        draw(); // 重新绘制
    } catch (error) {
        console.error('❌ Failed to load tasks:', error);
        console.warn('⚠️  后端服务器未响应，使用模拟数据');
        console.info('💡 提示: 请运行以下命令启动后端服务器:');
        console.info('   cd ScheduleApi');
        console.info('   dotnet run');
        console.info('');
        console.info('   或使用一键启动脚本:');
        console.info('   .\\start_with_diagnostics.ps1');
        
        // 使用模拟数据作为备选
        tasks = [];
        for (let i = 0; i < 10; i++) {
            tasks.push({
                group: "核心A项目", subGroup: "模块" + (i % 5),
                name: "开发任务 #" + i,
                start_date: "2026-04-06", end_date: "2026-04-15",
                start_day: i % 10,
                duration: 5 + (i % 8),
                plan: 100, actual: Math.floor(Math.random() * 100),
                owner: ["张三", "李四", "王五"][i % 3]
            });
        }
        console.log(`📊 使用模拟数据 (${tasks.length} 条记录)`);
        draw();
    }
}

// 保存任务更新
async function saveTask(taskId, updates) {
    try {
        const response = await fetch(`${API_BASE_URL}/tasks/${taskId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updates)
        });
        
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const result = await response.json();
        console.log('Task updated:', result);
        return true;
    } catch (error) {
        console.error('Failed to update task:', error);
        alert('保存失败，请检查网络连接');
        return false;
    }
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- 3. 绘制逻辑 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const startRow = Math.max(0, Math.floor(-offsetY / ROW_HEIGHT));
    const endRow = Math.min(tasks.length, startRow + Math.ceil(canvas.height / ROW_HEIGHT) + 1);

    // A. 绘制右侧甘特图
    drawGanttChart(startRow, endRow);

    // B. 绘制左侧固定列
    drawFixedColumns(startRow, endRow);

    // C. 绘制表头
    drawHeader();

    requestAnimationFrame(draw);
}

function drawFixedColumns(start, end) {
    ctx.save();
    ctx.translate(0, offsetY + HEADER_HEIGHT);

    for (let i = start; i < end; i++) {
        const y = i * ROW_HEIGHT;
        const task = tasks[i];

        // 背景
        ctx.fillStyle = i % 2 === 0 ? "#ffffff" : "#f8f9fa";
        ctx.fillRect(0, y, FIXED_WIDTH, ROW_HEIGHT);
        
        ctx.strokeStyle = "#dee2e6";
        ctx.lineWidth = 0.5;
        ctx.strokeRect(0, y, FIXED_WIDTH, ROW_HEIGHT);

        let curX = 0;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        COL_CONFIG.forEach(col => {
            ctx.fillStyle = "#333";
            if (col.keys.length === 2) {
                // 上下双行结构
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(task[col.keys[0]], curX + 10, y + ROW_HEIGHT * 0.3);
                ctx.font = "11px sans-serif";
                ctx.fillStyle = "#666";
                ctx.fillText(task[col.keys[1]], curX + 10, y + ROW_HEIGHT * 0.7);
            } else {
                // 单行结构
                ctx.font = "13px sans-serif";
                ctx.fillText(task[col.keys[0]], curX + 10, y + ROW_HEIGHT / 2);
            }
            curX += col.width;
            ctx.beginPath(); ctx.moveTo(curX, y); ctx.lineTo(curX, y + ROW_HEIGHT); ctx.stroke();
        });
    }
    ctx.restore();
}

function drawGanttChart(start, end) {
    ctx.save();
    ctx.beginPath(); ctx.rect(FIXED_WIDTH, 0, canvas.width - FIXED_WIDTH, canvas.height); ctx.clip();
    ctx.translate(FIXED_WIDTH + offsetX, offsetY + HEADER_HEIGHT);

    for (let i = start; i < end; i++) {
        const y = i * ROW_HEIGHT;
        const task = tasks[i];

        // 背景网格
        ctx.strokeStyle = "#f1f1f1";
        ctx.beginPath(); ctx.moveTo(-offsetX, y + ROW_HEIGHT); ctx.lineTo(canvas.width, y + ROW_HEIGHT); ctx.stroke();

        // 绘制进度条
        const barY = y + 18;
        const barHeight = 14;
        const totalW = task.duration * DAY_WIDTH;
        
        // 计划 (灰色底)
        ctx.fillStyle = "#e9ecef";
        ctx.roundRect(task.start_day * DAY_WIDTH, barY, totalW, barHeight, 4);
        ctx.fill();

        // 实际 (蓝色)
        const actualW = totalW * (task.actual / 100);
        ctx.fillStyle = task.actual >= task.plan ? "#40c057" : "#4a90e2";
        ctx.roundRect(task.start_day * DAY_WIDTH, barY, actualW, barHeight, 4);
        ctx.fill();
    }
    ctx.restore();
}

function drawHeader() {
    ctx.fillStyle = "#343a40";
    ctx.fillRect(0, 0, canvas.width, HEADER_HEIGHT);
    ctx.fillStyle = "white";
    ctx.font = "bold 13px sans-serif";

    let curX = 10;
    COL_CONFIG.forEach(col => {
        ctx.fillText(col.name, curX, HEADER_HEIGHT / 2 + 5);
        curX += col.width;
    });

    // 日期头 - 使用真实日期
    ctx.save();
    ctx.beginPath(); 
    ctx.rect(FIXED_WIDTH, 0, canvas.width - FIXED_WIDTH, HEADER_HEIGHT); 
    ctx.clip();
    ctx.translate(FIXED_WIDTH + offsetX, 0);
    
    const startDate = new Date('2026-04-01');
    const visibleDays = Math.ceil((canvas.width - FIXED_WIDTH) / DAY_WIDTH) + 2;
    const startDay = Math.max(0, Math.floor(-offsetX / DAY_WIDTH) - 1);
    
    for (let d = 0; d < visibleDays; d++) {
        const dayIndex = startDay + d;
        if (dayIndex < 0) continue;
        
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + dayIndex);
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentDate.getDate()).padStart(2, '0');
        
        // 检查是否为周六或周日，设置不同背景色
        const dayOfWeek = currentDate.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            ctx.fillRect(dayIndex * DAY_WIDTH, 0, DAY_WIDTH, HEADER_HEIGHT);
        }
        
        ctx.fillStyle = "white";
        ctx.fillText(`${month}/${day}`, dayIndex * DAY_WIDTH + 10, HEADER_HEIGHT / 2 + 5);
        
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.strokeRect(dayIndex * DAY_WIDTH, 0, DAY_WIDTH, HEADER_HEIGHT);
    }
    ctx.restore();
}

// --- 4. 交互：编辑逻辑 ---
canvas.onclick = (e) => {
    if (e.clientX > FIXED_WIDTH) {
        editor.style.display = 'none';
        return;
    }

    const row = Math.floor((e.clientY - (offsetY + HEADER_HEIGHT)) / ROW_HEIGHT);
    if (row < 0 || row >= tasks.length) return;

    // 确定点击了哪一列
    let curX = 0, targetCol = null;
    for (let col of COL_CONFIG) {
        if (e.clientX >= curX && e.clientX < curX + col.width) {
            targetCol = col;
            break;
        }
        curX += col.width;
    }

    if (targetCol) {
        showEditor(e.clientX, e.clientY, row, targetCol, curX);
    }
};

function showEditor(x, y, rowIdx, col, colLeft) {
    const task = tasks[rowIdx];
    editingInfo = { rowIdx, col };
    
    editor.style.display = 'block';
    editor.style.left = colLeft + 'px';
    editor.style.top = (rowIdx * ROW_HEIGHT + offsetY + HEADER_HEIGHT) + 'px';
    editor.style.width = (col.width - 15) + 'px';
    editor.style.height = (ROW_HEIGHT - 10) + 'px';
    
    // 如果是合并列，编辑第一个 key
    editor.value = task[col.keys[0]];
    editor.focus();
}

editor.onblur = async () => {
    if (editingInfo) {
        const task = tasks[editingInfo.rowIdx];
        const oldValue = task[editingInfo.col.keys[0]];
        const newValue = editor.value;
        
        if (oldValue !== newValue) {
            task[editingInfo.col.keys[0]] = newValue;
            
            // 保存到数据库
            const updates = {};
            updates[editingInfo.col.keys[0]] = newValue;
            
            // 如果编辑的是组名，需要同时更新 group_name 字段
            if (editingInfo.col.keys[0] === 'group') {
                updates['group'] = newValue;
            }
            
            const success = await saveTask(task.id, updates);
            if (!success) {
                // 恢复旧值如果保存失败
                task[editingInfo.col.keys[0]] = oldValue;
            }
        }
        
        editor.style.display = 'none';
        editingInfo = null;
        draw(); // 重绘以显示更新
    }
};

editor.onkeydown = (e) => { if(e.key === 'Enter') editor.blur(); };

// --- 5. 滚动逻辑 ---
window.onwheel = (e) => {
    if (e.shiftKey) offsetX -= e.deltaY;
    else offsetY -= e.deltaY;
    
    // 简易边界限制
    offsetY = Math.min(0, Math.max(offsetY, -(tasks.length * ROW_HEIGHT - canvas.height + HEADER_HEIGHT)));
    offsetX = Math.min(0, offsetX);
    editor.style.display = 'none'; // 滚动时关闭编辑
};

// 页面加载时从数据库加载任务
loadTasks();

// --- 6. 搜索过滤功能 ---
const searchInput = document.getElementById('search-input');

async function searchTasksByOwner(searchTerm) {
    if (!searchTerm.trim()) {
        // 如果搜索框为空，重新加载所有任务
        await loadTasks();
    } else {
        try {
            const response = await fetch(`${API_BASE_URL}/tasks/search?owner=${encodeURIComponent(searchTerm)}`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            tasks = await response.json();
            
            // 确保数据格式正确
            tasks.forEach(task => {
                task.group = task.group || "核心A项目";
                task.subGroup = task.subGroup || "模块0";
                task.start_date = task.start_date || "2026-04-06";
                task.end_date = task.end_date || "2026-04-15";
                task.start_day = task.start_day || 0;
                task.duration = task.duration || 5;
                task.plan = task.plan || 100;
                task.actual = task.actual || 0;
                task.owner = task.owner || "张三";
            });
            
            console.log(`Found ${tasks.length} tasks for owner: ${searchTerm}`);
            
            // 重新计算滚动边界
            offsetY = Math.min(0, offsetY); // 确保不会超出范围
            editor.style.display = 'none';
            
            // 触发重绘
            draw();
        } catch (error) {
            console.error('Failed to search tasks:', error);
            alert('搜索失败，请检查网络连接');
        }
    }
}

let searchTimeout;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchTasksByOwner(e.target.value);
    }, 300); // 防抖：300ms延迟
});

// --- 7. 导出PNG功能 ---
const exportBtn = document.getElementById('export-btn');
exportBtn.addEventListener('click', () => {
    // 创建一个离屏canvas用于高质量导出
    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d');
    
    // 计算所需宽度（固定列宽度 + 甘特图区域）
    const totalWidth = FIXED_WIDTH + (100 * DAY_WIDTH); // 100天的宽度
    const totalHeight = HEADER_HEIGHT + (tasks.length * ROW_HEIGHT);
    
    // 设置离屏canvas尺寸（可调整缩放比例）
    const scale = 2; // 2倍尺寸以获得高清图片
    offscreenCanvas.width = totalWidth * scale;
    offscreenCanvas.height = totalHeight * scale;
    
    // 缩放上下文
    offscreenCtx.scale(scale, scale);
    
    // 保存当前滚动状态
    const originalOffsetX = offsetX;
    const originalOffsetY = offsetY;
    
    // 临时设置滚动为0以捕获完整视图
    offsetX = 0;
    offsetY = 0;
    
    // 绘制完整内容到离屏canvas
    offscreenCtx.fillStyle = "white";
    offscreenCtx.fillRect(0, 0, totalWidth, totalHeight);
    
    // 绘制表头
    offscreenCtx.fillStyle = "#343a40";
    offscreenCtx.fillRect(0, 0, totalWidth, HEADER_HEIGHT);
    offscreenCtx.fillStyle = "white";
    offscreenCtx.font = "bold 13px sans-serif";
    
    let curX = 10;
    COL_CONFIG.forEach(col => {
        offscreenCtx.fillText(col.name, curX, HEADER_HEIGHT / 2 + 5);
        curX += col.width;
    });
    
    // 绘制日期头
    offscreenCtx.save();
    offscreenCtx.beginPath(); 
    offscreenCtx.rect(FIXED_WIDTH, 0, totalWidth - FIXED_WIDTH, HEADER_HEIGHT); 
    offscreenCtx.clip();
    offscreenCtx.translate(FIXED_WIDTH, 0);
    
    // 使用真实日期显示
    const startDate = new Date('2026-04-01');
    for (let d = 0; d < 100; d++) {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + d);
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentDate.getDate()).padStart(2, '0');
        
        // 检查是否为周六或周日
        const dayOfWeek = currentDate.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
            offscreenCtx.fillStyle = "rgba(255,255,255,0.1)";
            offscreenCtx.fillRect(d * DAY_WIDTH, 0, DAY_WIDTH, HEADER_HEIGHT);
        }
        
        offscreenCtx.fillStyle = "white";
        offscreenCtx.fillText(`${month}/${day}`, d * DAY_WIDTH + 10, HEADER_HEIGHT / 2 + 5);
        
        offscreenCtx.strokeStyle = "rgba(255,255,255,0.1)";
        offscreenCtx.strokeRect(d * DAY_WIDTH, 0, DAY_WIDTH, HEADER_HEIGHT);
    }
    offscreenCtx.restore();
    
    // 绘制固定列
    offscreenCtx.save();
    offscreenCtx.translate(0, HEADER_HEIGHT);
    
    for (let i = 0; i < tasks.length; i++) {
        const y = i * ROW_HEIGHT;
        const task = tasks[i];
        
        // 背景
        offscreenCtx.fillStyle = i % 2 === 0 ? "#ffffff" : "#f8f9fa";
        offscreenCtx.fillRect(0, y, FIXED_WIDTH, ROW_HEIGHT);
        
        offscreenCtx.strokeStyle = "#dee2e6";
        offscreenCtx.lineWidth = 0.5;
        offscreenCtx.strokeRect(0, y, FIXED_WIDTH, ROW_HEIGHT);
        
        let colX = 0;
        offscreenCtx.textAlign = "left";
        offscreenCtx.textBaseline = "middle";
        
        COL_CONFIG.forEach(col => {
            offscreenCtx.fillStyle = "#333";
            if (col.keys.length === 2) {
                offscreenCtx.font = "bold 12px sans-serif";
                offscreenCtx.fillText(task[col.keys[0]], colX + 10, y + ROW_HEIGHT * 0.3);
                offscreenCtx.font = "11px sans-serif";
                offscreenCtx.fillStyle = "#666";
                offscreenCtx.fillText(task[col.keys[1]], colX + 10, y + ROW_HEIGHT * 0.7);
            } else {
                offscreenCtx.font = "13px sans-serif";
                offscreenCtx.fillText(task[col.keys[0]], colX + 10, y + ROW_HEIGHT / 2);
            }
            colX += col.width;
        });
    }
    offscreenCtx.restore();
    
    // 绘制甘特图
    offscreenCtx.save();
    offscreenCtx.beginPath(); 
    offscreenCtx.rect(FIXED_WIDTH, HEADER_HEIGHT, totalWidth - FIXED_WIDTH, totalHeight - HEADER_HEIGHT); 
    offscreenCtx.clip();
    offscreenCtx.translate(FIXED_WIDTH, HEADER_HEIGHT);
    
    for (let i = 0; i < tasks.length; i++) {
        const y = i * ROW_HEIGHT;
        const task = tasks[i];
        
        // 背景网格
        offscreenCtx.strokeStyle = "#f1f1f1";
        offscreenCtx.beginPath(); 
        offscreenCtx.moveTo(0, y + ROW_HEIGHT); 
        offscreenCtx.lineTo(totalWidth, y + ROW_HEIGHT); 
        offscreenCtx.stroke();
        
        // 绘制进度条
        const barY = y + 18;
        const barHeight = 14;
        const totalW = task.duration * DAY_WIDTH;
        
        // 计划 (灰色底)
        offscreenCtx.fillStyle = "#e9ecef";
        offscreenCtx.roundRect(task.start_day * DAY_WIDTH, barY, totalW, barHeight, 4);
        offscreenCtx.fill();
        
        // 实际进度条
        const actualW = totalW * (task.actual / 100);
        
        // 根据需求设置颜色
        let fillColor;
        if (task.actual >= task.plan) {
            fillColor = "#40c057"; // 绿色：实际 >= 计划
        } else {
            fillColor = "#4a90e2"; // 蓝色：实际 < 计划
        }
        
        // 检查是否逾期
        const endDate = new Date(task.start_date);
        endDate.setDate(endDate.getDate() + task.duration);
        const today = new Date('2026-04-06'); // 模拟当前日期
        if (endDate < today && task.actual < 100) {
            fillColor = "#ff6b6b"; // 红色：逾期且进度未达100%
        }
        
        offscreenCtx.fillStyle = fillColor;
        offscreenCtx.roundRect(task.start_day * DAY_WIDTH, barY, actualW, barHeight, 4);
        offscreenCtx.fill();
    }
    offscreenCtx.restore();
    
    // 恢复原始滚动状态
    offsetX = originalOffsetX;
    offsetY = originalOffsetY;
    
    // 将离屏canvas转换为图片并下载
    const link = document.createElement('a');
    link.download = `日程表_${new Date().toISOString().slice(0,10)}.png`;
    link.href = offscreenCanvas.toDataURL('image/png');
    link.click();
});
</script>
</body>
</html>
