<!DOCTYPE html>
<html>
<head>
    <title>六边形验证 - 像素检测</title>
</head>
<body>
    <h1>六边形间距像素级验证</h1>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div id="result"></div>
    
    <script src="js/config.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const result = document.getElementById('result');
        
        // 清空为黑色背景
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const cellSize = CONFIG.MAP.CELL_SIZE;
        const hexRadius = cellSize * 0.866;
        
        console.log('参数:', { cellSize, hexRadius });
        
        // 绘制六边形函数
        function drawHex(cx, cy, r, color) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }
        
        // 计算中心位置
        function getCenter(gx, gy) {
            const hexWidth = cellSize * Math.sqrt(3);
            const hexHeight = cellSize * 2;
            const xOffset = (gy % 2) * (hexWidth / 2);
            const wx = gx * hexWidth + xOffset + hexWidth / 2;
            const wy = gy * hexHeight * 0.75 + hexHeight / 2;
            return { x: wx, y: wy };
        }
        
        // 绘制3x3的六边形网格
        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
        for (let gy = 0; gy < 3; gy++) {
            for (let gx = 0; gx < 3; gx++) {
                const pos = getCenter(gx, gy);
                const color = colors[(gx + gy) % colors.length];
                drawHex(pos.x, pos.y, hexRadius, color);
            }
        }
        
        // 像素检测：检查两个相邻六边形之间是否有黑色像素
        setTimeout(() => {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let blackPixelCount = 0;
            let totalPixels = 0;
            
            // 采样检查中间的像素
            for (let y = 50; y < 350; y += 5) {
                for (let x = 50; x < 550; x += 5) {
                    const idx = (y * canvas.width + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    
                    // 如果是黑色（或接近黑色）
                    if (r < 50 && g < 50 && b < 50) {
                        blackPixelCount++;
                    }
                    totalPixels++;
                }
            }
            
            const blackPercent = (blackPixelCount / totalPixels * 100).toFixed(2);
            
            let message = '';
            if (blackPercent < 5) {
                message = `✅ 通过！黑色像素占比 ${blackPercent}%，六边形紧密排列`;
                result.innerHTML = `<h2 style="color:green">${message}</h2>`;
                console.log(message);
            } else {
                message = `❌ 失败！黑色像素占比 ${blackPercent}%，六边形之间有间隙`;
                result.innerHTML = `<h2 style="color:red">${message}</h2>`;
                console.log(message);
            }
            
            // 输出详细信息
            console.log(`总采样像素: ${totalPixels}`);
            console.log(`黑色像素: ${blackPixelCount}`);
            console.log(`黑色占比: ${blackPercent}%`);
        }, 100);
    </script>
</body>
</html>
