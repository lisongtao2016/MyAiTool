<!DOCTYPE html>
<html>
<head>
    <title>标准六边形测试</title>
</head>
<body>
    <h1>标准平顶六边形网格（参考实现）</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 清空背景
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 标准平顶六边形参数
        const radius = 30; // 外接圆半径
        const hexWidth = radius * 2; // 宽度 = 2r
        const hexHeight = Math.sqrt(3) * radius; // 高度 = √3 * r
        
        console.log('标准参数:', { radius, hexWidth: hexWidth.toFixed(2), hexHeight: hexHeight.toFixed(2) });
        
        // 绘制六边形
        function drawHex(cx, cy, r, color) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6; // 平顶六边形
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // 平顶六边形网格布局
        // 水平间距 = 1.5 * r
        // 垂直间距 = √3 * r
        const horizSpacing = 1.5 * radius;
        const vertSpacing = Math.sqrt(3) * radius;
        
        console.log('间距:', { 
            horizontal: horizSpacing.toFixed(2), 
            vertical: vertSpacing.toFixed(2) 
        });
        
        // 绘制网格
        const colors = ['#98D98E', '#4A7C59', '#5B9BD5', '#8B7355', '#A0522D'];
        let count = 0;
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 10; col++) {
                const cx = 50 + col * horizSpacing;
                const cy = 50 + row * vertSpacing + (col % 2) * (vertSpacing / 2);
                
                drawHex(cx, cy, radius, colors[count % colors.length]);
                count++;
            }
        }
        
        console.log('绘制完成，请检查六边形是否紧密排列');
    </script>
</body>
</html>
