<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>六边形间距验证</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
            font-family: Arial;
        }
        canvas {
            border: 2px solid #4a7c59;
            display: block;
            margin: 20px auto;
            background: #0a0a0a;
        }
        .info {
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center">🔍 六边形间距验证</h1>
    
    <div class="info">
        <p>如果六边形紧密排列（无间隙），说明修复成功 ✅</p>
        <p>如果六边形之间有黑色间隙，说明还需要调整 ❌</p>
    </div>
    
    <canvas id="test-canvas" width="800" height="600"></canvas>
    
    <script src="js/config.js"></script>
    <script>
        const canvas = document.getElementById('test-canvas');
        const ctx = canvas.getContext('2d');
        
        // 清空画布
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 测试参数
        const cellSize = CONFIG.MAP.CELL_SIZE; // 64px
        const hexRadius = cellSize * 0.866; // 修正后的半径: (size * sqrt(3)) / 2
        
        console.log('测试参数:');
        console.log('- cellSize:', cellSize);
        console.log('- hexRadius:', hexRadius.toFixed(2));
        console.log('- hexWidth:', (cellSize * Math.sqrt(3)).toFixed(2));
        console.log('- hexHeight:', cellSize * 2);
        console.log('- 水平间距:', (cellSize * Math.sqrt(3)).toFixed(2));
        console.log('- 垂直间距:', (cellSize * 1.5).toFixed(2));
        console.log('- 半径/水平间距比:', (hexRadius / (cellSize * Math.sqrt(3) / 2) * 100).toFixed(1) + '%');
        
        // 绘制六边形的函数
        function drawHexagon(centerX, centerY, radius, color) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // 计算六边形中心位置（与 map.js 中的 hexGridToScreen 逻辑一致）
        function getHexCenter(gridX, gridY) {
            const size = cellSize;
            const hexWidth = size * Math.sqrt(3);
            const hexHeight = size * 2;
            
            const xOffset = (gridY % 2) * (hexWidth / 2);
            const worldX = gridX * hexWidth + xOffset + hexWidth / 2;
            const worldY = gridY * hexHeight * 0.75 + hexHeight / 2;
            
            return { x: worldX, y: worldY };
        }
        
        // 绘制多行六边形进行测试
        const colors = ['#98D98E', '#4A7C59', '#5B9BD5', '#8B7355', '#A0522D'];
        const rows = 5;
        const cols = 8;
        
        console.log('\n开始绘制六边形网格...');
        
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const pos = getHexCenter(x, y);
                const color = colors[(x + y) % colors.length];
                
                drawHexagon(pos.x, pos.y, hexRadius, color);
                
                // 在第一个六边形上标注信息
                if (x === 0 && y === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`R=${hexRadius.toFixed(1)}`, pos.x, pos.y + hexRadius + 15);
                }
            }
        }
        
        console.log(`绘制完成: ${rows}行 × ${cols}列`);
        console.log('请检查Canvas，六边形应该紧密排列，没有间隙');
        
        // 添加图例
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('✅ 正确：六边形紧密排列，无缝隙', 20, 30);
        ctx.fillText('❌ 错误：六边形之间有黑色间隙', 20, 55);
    </script>
</body>
</html>
